          - ax-voc-weekly
          - ax-cs-checklist
          - ax-training-attend
          - ax-survey-summary
          - ax-onboarding-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm test
        working-directory: ${{ matrix.service }}
        run: npm test
