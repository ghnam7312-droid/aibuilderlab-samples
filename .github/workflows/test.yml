          - ax-weekly-report
          - startup-academy-report
          - startup-wrong-answer
          - startup-interview-board
          - career-ab-copy
          - career-sns-report
          - career-campaign-plan
          - career-district-dash
          - career-survey-sort
          - career-library-seat
          - career-clinic-booking
          - career-design-review
          - career-kiosk-a11y
          - career-fraction-quiz
          - career-quiz-maker
          - career-microlearning
          - career-lab-booking
          - career-devlog
          - career-tech-spec
          - startup-speaking-coach
          - startup-lesson-report
          - startup-price-test
          - startup-coach-brief
          - startup-coach-booking
          - startup-coach-landing
          - startup-class-feedback
          - startup-class-faq
          - startup-class-pricing
          - startup-labor-intake
